<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">Rectas paralelas l2 y l3 cortadas por l1</title>
<desc id="desc">l2 y l3 son paralelas, l1 es secante; se muestran el ángulo beta y un ángulo de 50 grados.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#111"/>
  </marker>
</defs>

<line x1="150" y1="410" x2="690" y2="120" stroke="#111" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="245" y1="535" x2="785" y2="245" stroke="#111" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="500" y1="560" x2="610" y2="70" stroke="#111" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="610" y="64" font-family="Arial,Helvetica,sans-serif" font-size="27" font-style="italic">l₁</text>
<text x="700" y="120" font-family="Arial,Helvetica,sans-serif" font-size="27" font-style="italic">l₂</text>
<text x="793" y="245" font-family="Arial,Helvetica,sans-serif" font-size="27" font-style="italic">l₃</text>
<path d="M 568 255 A 43 43 0 0 1 594 292" fill="none" stroke="#111" stroke-width="2.5"/>
<text x="598" y="300" font-family="Arial,Helvetica,sans-serif" font-size="28" font-style="italic">β</text>
<path d="M 530 427 A 44 44 0 0 0 493 443" fill="none" stroke="#111" stroke-width="2.5"/>
<text x="455" y="465" font-family="Arial,Helvetica,sans-serif" font-size="26">50°</text>
</svg>