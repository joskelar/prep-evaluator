<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Triángulos semejantes ABC y DFE</title>
<desc id="desc">Triángulo pequeño ABC con base 6 y lados r y s; triángulo grande DFE con lados 10, 8 y base 12.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#111"/>
  </marker>
</defs>

<polygon points="110,430 390,430 260,240" fill="none" stroke="#111" stroke-width="4"/>
<polygon points="535,430 900,430 725,150" fill="none" stroke="#111" stroke-width="4"/>
<text x="85" y="454" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">A</text>
<text x="398" y="454" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">B</text>
<text x="252" y="222" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">C</text>
<text x="250" y="464" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28">6</text>
<text x="178" y="332" font-family="Arial,Helvetica,sans-serif" font-size="28" font-style="italic">r</text>
<text x="330" y="328" font-family="Arial,Helvetica,sans-serif" font-size="28" font-style="italic">s</text>
<text x="510" y="454" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">D</text>
<text x="908" y="454" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">F</text>
<text x="717" y="132" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">E</text>
<text x="717" y="466" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28">12</text>
<text x="612" y="300" font-family="Arial,Helvetica,sans-serif" font-size="28">10</text>
<text x="835" y="295" font-family="Arial,Helvetica,sans-serif" font-size="28">8</text>
</svg>