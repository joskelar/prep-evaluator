<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
<title id="title">Prisma rectangular con planos etiquetados</title>
<desc id="desc">Prisma rectangular en perspectiva con cara frontal ABCD y cara posterior EFGH. Los planos ABCD y AEFB comparten la arista AB.</desc>
<rect width="100%" height="100%" fill="white"/>

<g fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round">
<polygon points="280,180 570,180 570,440 280,440"/>
<polygon points="390,100 680,100 680,360 390,360"/>
<line x1="280" y1="180" x2="390" y2="100"/>
<line x1="570" y1="180" x2="680" y2="100"/>
<line x1="570" y1="440" x2="680" y2="360"/>
<line x1="280" y1="440" x2="390" y2="360"/>
</g>
<line x1="280" y1="180" x2="570" y2="180" stroke="#111" stroke-width="6"/>
<text x="254" y="188" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">A</text>
<text x="580" y="188" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">B</text>
<text x="580" y="468" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">C</text>
<text x="252" y="468" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">D</text>
<text x="370" y="90" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">E</text>
<text x="690" y="90" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">F</text>
<text x="690" y="378" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">G</text>
<text x="362" y="378" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">H</text>
</svg>