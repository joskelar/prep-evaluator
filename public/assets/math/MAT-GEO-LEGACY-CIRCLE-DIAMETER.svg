<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">Círculo con diámetro AB</title>
<desc id="desc">Círculo con centro R y diámetro AB igual a 10.</desc>
<rect width="100%" height="100%" fill="white"/>

<g fill="none" stroke="#111" stroke-width="4">
<circle cx="450" cy="300" r="190"/>
<line x1="260" y1="300" x2="640" y2="300"/>
</g>
<circle cx="450" cy="300" r="5.5" fill="#111"/>
<text x="230" y="310" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">A</text>
<text x="652" y="310" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">B</text>
<text x="462" y="288" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">R</text>
<text x="450" y="275" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27">AB = 10</text>
</svg>