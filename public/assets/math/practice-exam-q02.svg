<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">Ecuación con exponente faltante</title>
<desc id="desc">a al cuadrado multiplicado por a elevado a un exponente en blanco es igual a a a la sexta.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#111">
  <text x="180" y="210" font-size="92" font-style="italic">a</text>
  <text x="235" y="150" font-size="48">2</text>
  <text x="300" y="210" font-size="92" font-style="italic">a</text>
  <rect x="355" y="105" width="66" height="66" fill="none" stroke="#111" stroke-width="4"/>
  <text x="475" y="210" font-size="88">=</text>
  <text x="610" y="210" font-size="92" font-style="italic">a</text>
  <text x="665" y="150" font-size="48">6</text>
</g>
</svg>