<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">Paralelas con dos diagonales</title>
<desc id="desc">Dos rectas horizontales paralelas; dos diagonales forman una X sobre l1; se indican 60°, x y 130°.</desc>
<rect width="100%" height="100%" fill="white"/>

<line x1="100" y1="240" x2="800" y2="240" stroke="#111" stroke-width="4"/>
<line x1="100" y1="470" x2="800" y2="470" stroke="#111" stroke-width="4"/>
<text x="812" y="248" font-family="Arial,Helvetica,sans-serif" font-size="24" font-style="italic">l₁</text>
<text x="812" y="478" font-family="Arial,Helvetica,sans-serif" font-size="24" font-style="italic">l₂</text>
<line x1="250" y1="80" x2="700" y2="560" stroke="#111" stroke-width="4"/>
<line x1="650" y1="80" x2="300" y2="560" stroke="#111" stroke-width="4"/>
<path d="M 404 240 A 50 50 0 0 1 420 205" fill="none" stroke="#111" stroke-width="2.5"/>
<text x="365" y="205" font-family="Arial,Helvetica,sans-serif" font-size="25">60°</text>
<path d="M 420 275 A 55 55 0 0 1 480 275" fill="none" stroke="#111" stroke-width="2.5"/>
<text x="445" y="320" font-family="Arial,Helvetica,sans-serif" font-size="28" font-style="italic">x</text>
<path d="M 588 470 A 48 48 0 0 1 610 435" fill="none" stroke="#111" stroke-width="2.5"/>
<text x="615" y="435" font-family="Arial,Helvetica,sans-serif" font-size="25">130°</text>
</svg>